<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BOLT · Material de aire</title>
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">

<style>
  @font-face{
    font-family:"Inter";font-style:normal;font-weight:100 900;font-display:swap;
    src:url("../fuentes/InterVariable.woff2") format("woff2");
  }
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#08090A;--surf:rgba(255,255,255,.035);--surf2:rgba(255,255,255,.06);
    --bord:rgba(255,255,255,.09);--bord2:rgba(255,255,255,.16);
    --y:#FFD600;--tx:#FFFFFF;--tx2:#9BA1A8;--tx3:#6B7278;--rojo:#E5484D;
  }
  html{scroll-behavior:smooth}
  body{
    font-family:"Inter",-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    font-feature-settings:"cv05" 1,"ss03" 1;
    background:var(--bg);color:var(--tx);line-height:1.6;overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none}
  img{max-width:100%;display:block}
  h1,h2,h3{font-weight:600;letter-spacing:-.03em;line-height:1.1}
  .wrap{max-width:1000px;margin:0 auto;padding:0 22px}
  section{padding:52px 0;border-top:1px solid var(--bord)}
  section:first-of-type{border-top:0}

  /* ── La puerta ───────────────────────────────────────────────────────── */
  #puerta{
    position:fixed;inset:0;z-index:100;background:var(--bg);
    display:flex;align-items:center;justify-content:center;padding:24px;
  }
  #puerta .caja-puerta{width:100%;max-width:400px;text-align:center}
  #puerta .marca{
    font-size:1.1rem;font-weight:700;letter-spacing:.32em;color:var(--y);margin-bottom:26px;
  }
  #puerta h1{font-size:1.55rem;margin-bottom:10px}
  #puerta p{color:var(--tx2);font-size:.95rem;margin-bottom:26px}
  #puerta form{display:flex;flex-direction:column;gap:10px}
  #puerta input{
    width:100%;background:var(--surf);border:1px solid var(--bord);border-radius:999px;
    padding:16px 22px;color:var(--tx);font-family:inherit;font-size:1.05rem;
    text-align:center;letter-spacing:.14em;text-transform:uppercase;outline:none;
  }
  #puerta input:focus{border-color:var(--bord2)}
  #puerta button{
    background:var(--y);color:#08090A;border:0;border-radius:999px;padding:16px;
    font-family:inherit;font-size:1rem;font-weight:600;cursor:pointer;
  }
  #puerta button:disabled{opacity:.5;cursor:default}
  #puerta .mal{color:var(--rojo);font-size:.9rem;min-height:22px;margin:12px 0 0}
  #puerta .pie{color:var(--tx3);font-size:.82rem;margin:26px 0 0}

  /* ── Cabecera ────────────────────────────────────────────────────────── */
  header{padding:74px 22px 46px;max-width:1000px;margin:0 auto}
  .eyebrow,.sec{
    font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;
    color:var(--tx3);font-weight:600;margin-bottom:14px;
  }
  header h1{font-size:clamp(2.2rem,7vw,3.6rem);margin-bottom:18px}
  header h1 em{font-style:normal;color:var(--y)}
  .bajada{font-size:1.12rem;color:var(--tx2);max-width:640px}
  .fecha{color:var(--tx3);font-size:.85rem;margin-top:20px}
  h2{font-size:clamp(1.5rem,4vw,2.1rem);margin-bottom:20px}
  h3{font-size:1.02rem;margin-bottom:10px}
  p{margin-bottom:14px}
  p:last-child{margin-bottom:0}
  .grande{font-size:1.08rem;color:var(--tx2)}
  .chico{font-size:.92rem;color:var(--tx2)}

  /* ── Bloques ─────────────────────────────────────────────────────────── */
  .cols{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:26px;align-items:start}
  @media(max-width:820px){.cols{grid-template-columns:minmax(0,1fr)}}
  .caja{background:var(--surf);border:1px solid var(--bord);border-radius:22px;padding:24px;min-width:0}
  .frase{font-size:1.5rem;font-weight:600;color:var(--y);letter-spacing:-.02em;margin:8px 0 14px}

  .alerta{
    background:rgba(255,214,0,.06);border:1px solid rgba(255,214,0,.28);
    border-radius:22px;padding:26px;
  }
  .alerta h3{color:var(--y);font-size:1.12rem}
  .pendientes{list-style:none;margin-top:16px;display:grid;gap:10px}
  .pendientes li{
    background:rgba(0,0,0,.25);border-radius:14px;padding:12px 16px;
    font-size:.95rem;color:var(--tx2);
  }
  .pendientes span{
    display:inline-block;color:var(--y);font-weight:600;font-size:.82rem;
    letter-spacing:.06em;margin-right:8px;
  }
  .pendientes b{color:var(--tx)}

  .pasos{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
  .paso{background:var(--surf);border:1px solid var(--bord);border-radius:22px;padding:24px;min-width:0}
  .paso .num{
    display:flex;align-items:center;justify-content:center;
    width:34px;height:34px;border-radius:999px;background:var(--y);color:#08090A;
    font-weight:700;font-size:.95rem;margin-bottom:14px;
  }
  .paso p{color:var(--tx2);font-size:.95rem}

  .oficios{display:flex;flex-wrap:wrap;gap:9px}
  .of{
    background:var(--surf);border:1px solid var(--bord);border-radius:999px;
    padding:10px 18px;font-size:.95rem;color:var(--tx2);
  }
  .of.destacado{background:var(--y);border-color:var(--y);color:#08090A;font-weight:600}

  /* ── La promo ────────────────────────────────────────────────────────── */
  .promo{
    background:linear-gradient(135deg,rgba(255,214,0,.14),rgba(255,214,0,.04));
    border:1px solid rgba(255,214,0,.34);border-radius:26px;padding:38px 30px;text-align:center;
  }
  .promo-titulo{font-size:clamp(1.9rem,6vw,2.9rem);font-weight:700;color:var(--y);letter-spacing:-.03em;margin-bottom:6px}
  .promo-sub{font-size:1.16rem;color:var(--tx);margin-bottom:18px}
  .promo-cupo{
    display:inline-block;background:rgba(0,0,0,.34);border-radius:999px;
    padding:9px 20px;font-size:.92rem;color:var(--tx2);margin:0;
  }
  .lista{list-style:none;display:grid;gap:11px}
  .lista li{padding-left:22px;position:relative;color:var(--tx2);font-size:.98rem}
  .lista li::before{content:'';position:absolute;left:0;top:.62em;width:7px;height:7px;border-radius:999px;background:var(--y)}
  .lista.no li::before{background:var(--rojo)}
  .lista strong{color:var(--tx)}

  /* ── Guiones ─────────────────────────────────────────────────────────── */
  .guion{background:var(--surf);border:1px solid var(--bord);border-radius:22px;overflow:hidden;margin-bottom:16px}
  .guion-top{
    display:flex;align-items:center;gap:12px;padding:14px 22px;
    border-bottom:1px solid var(--bord);background:rgba(0,0,0,.22);
  }
  .dur{
    background:var(--y);color:#08090A;border-radius:999px;padding:4px 13px;
    font-size:.82rem;font-weight:700;
  }
  .pal{color:var(--tx3);font-size:.85rem;margin-right:auto}
  .copiar{
    background:transparent;border:1px solid var(--bord2);border-radius:999px;
    color:var(--tx2);padding:7px 16px;font-family:inherit;font-size:.85rem;cursor:pointer;
  }
  .copiar:hover{background:var(--surf2);color:var(--tx)}
  .guion .texto{padding:24px 22px}
  .guion .texto p{font-size:1.12rem;line-height:1.75;margin-bottom:16px}
  .guion .texto p:last-child{margin-bottom:0}
  .guion .texto strong{color:var(--y)}
  .chico-guion .texto p{font-size:1rem;line-height:1.7}
  .menciones{display:grid;gap:14px}

  .spot{background:var(--surf);border:1px solid var(--bord);border-radius:22px;padding:12px 22px}
  .linea{display:grid;grid-template-columns:88px minmax(0,1fr);gap:16px;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.05)}
  .linea:last-child{border-bottom:0}
  .marca{font-size:.75rem;letter-spacing:.12em;color:var(--y);font-weight:600;padding-top:4px}
  .linea p{color:var(--tx);font-size:1rem;margin:0}
  .linea em{color:var(--tx3);font-style:normal}
  @media(max-width:560px){.linea{grid-template-columns:minmax(0,1fr);gap:4px}}

  .ojo{background:rgba(229,72,77,.05);border:1px solid rgba(229,72,77,.24);border-radius:26px;padding:32px 28px}
  .ojo h2{color:var(--rojo)}

  .capturas{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px}
  .capturas figure{background:var(--surf);border:1px solid var(--bord);border-radius:22px;overflow:hidden;min-width:0}
  .capturas img{width:100%;cursor:zoom-in}
  .capturas figcaption{padding:14px 16px;font-size:.88rem;color:var(--tx2)}

  .links{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
  .link{
    background:var(--surf);border:1px solid var(--bord);border-radius:18px;padding:18px 20px;
    display:block;transition:border-color .2s,background .2s;min-width:0;
  }
  .link:hover{border-color:var(--bord2);background:var(--surf2)}
  .link span{display:block;color:var(--y);font-weight:600;font-size:1rem;word-break:break-all}
  .link small{color:var(--tx3);font-size:.86rem}

  .contacto{background:var(--surf);border:1px solid var(--bord);border-radius:26px;padding:36px 30px}
  .contacto-btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
  .btn-y{background:var(--y);color:#08090A;border-radius:999px;padding:15px 26px;font-weight:600}
  .btn-b{background:var(--surf2);border:1px solid var(--bord);color:var(--tx);border-radius:999px;padding:15px 26px;font-weight:600}

  footer{padding:40px 22px 60px;text-align:center;border-top:1px solid var(--bord)}
  footer p{color:var(--tx3);font-size:.85rem;max-width:600px;margin:0 auto}

  /* Visor de capturas */
  #visor{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.94);display:none;align-items:center;justify-content:center;padding:26px;cursor:zoom-out}
  #visor.on{display:flex}
  #visor img{max-width:100%;max-height:92vh;object-fit:contain;border-radius:14px}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

    </form>
    <p class="mal" id="mal" role="alert"></p>
    <p class="pie">¿No tenés el código? Escribinos: soporte@bolt.com.ar</p>
  </div>
</div>

  var SALT = "yLQsm4fqzvikIyAYbB5znA==";
  var IV   = "vSJflUYQdUCwD2Tk";
  var LLAVE_SESION = 'bolt.publicidad.ok';

  function b64(s){ var b=atob(s), a=new Uint8Array(b.length); for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i); return a; }

  async function abrir(codigo){
    var enc = new TextEncoder();
    var base = await crypto.subtle.importKey('raw', enc.encode(codigo), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey(
      { name:'PBKDF2', salt:b64(SALT), iterations:250000, hash:'SHA-256' },
      base, { name:'AES-GCM', length:256 }, false, ['decrypt']
    );
    var claro = await crypto.subtle.decrypt({ name:'AES-GCM', iv:b64(IV) }, key, b64(BLOB));
    return new TextDecoder().decode(claro);
  }

  function contarPalabras(){
    document.querySelectorAll('[data-texto]').forEach(function(t){
      var n = t.innerText.trim().split(/\s+/).filter(Boolean).length;
      // Un locutor lee unas 2,5 palabras por segundo en tono conversado.
      var seg = Math.round(n / 2.5);
      var chip = t.closest('.guion').querySelector('[data-contar]');
      if (chip) chip.textContent = n + ' palabras · ~' + seg + ' seg leídas';
    });
  }

  function engancharCopiar(){
    document.querySelectorAll('[data-copiar]').forEach(function(b){
      b.addEventListener('click', function(){
        var t = b.closest('.guion').querySelector('[data-texto]').innerText.trim();
        navigator.clipboard.writeText(t).then(function(){
          var antes = b.textContent; b.textContent = 'Copiado';
          setTimeout(function(){ b.textContent = antes; }, 1600);
        }).catch(function(){ b.textContent = 'No se pudo'; });
      });
    });
  }

  function engancharVisor(){
    var v = document.getElementById('visor'), img = v.querySelector('img');
    document.querySelectorAll('.capturas img').forEach(function(i){
      i.addEventListener('click', function(){ img.src = i.src; v.classList.add('on'); });
    });
    v.addEventListener('click', function(){ v.classList.remove('on'); });
    document.addEventListener('keydown', function(e){ if(e.key==='Escape') v.classList.remove('on'); });
  }

  function pintar(html){
    document.getElementById('contenido').innerHTML = html;
    document.getElementById('puerta').remove();
    document.body.style.overflow = '';
    contarPalabras(); engancharCopiar(); engancharVisor();
  }

  var form = document.getElementById('formPuerta');
  var input = document.getElementById('codigo');
  var mal = document.getElementById('mal');
  var btn = document.getElementById('btnEntrar');

  form.addEventListener('submit', async function(e){

    mal.textContent = ''; btn.disabled = true; btn.textContent = 'Abriendo…';
    try {
      var html = await abrir(input.value.trim().toUpperCase());
      try { sessionStorage.setItem(LLAVE_SESION, input.value.trim().toUpperCase()); } catch(_){}

      mal.textContent = 'Ese código no es.';
      btn.disabled = false; btn.textContent = 'Entrar';
      input.select();
    }

  try {
    var guardado = sessionStorage.getItem(LLAVE_SESION);
