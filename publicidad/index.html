<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BOLT · Material de aire</title>
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="googlebot" content="noindex,nofollow">
<meta name="theme-color" content="#08090A">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="../logo.png">

<style>
  @font-face{
    font-family:"Inter";font-style:normal;font-weight:100 900;font-display:swap;
    src:url("../fuentes/InterVariable.woff2") format("woff2");
  }
  *{margin:0;padding:0;box-sizing:border-box}

  /* Inter en TODO. Ponerla sólo en body no alcanza: los controles de
     formulario —button, input, select, textarea— no heredan la fuente y el
     navegador les mete la del sistema. Se veía en los botones "Copiar" y en el
     campo del código, que salían en otra letra. */
  html,body,button,input,select,textarea,optgroup{
    font-family:"Inter",-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  ::placeholder{font-family:inherit}
  :root{
    --bg:#08090A;--vidrio:rgba(255,255,255,.055);--vidrio2:rgba(255,255,255,.09);
    --lin:rgba(255,255,255,.10);--lin2:rgba(255,255,255,.18);
    --y:#FFD600;--tx:#FFFFFF;--tx2:#B4BAC0;--tx3:#7C838A;--rojo:#E5484D;
  }
  html{scroll-behavior:smooth}
  body{
    font-family:"Inter",-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    font-feature-settings:"cv05" 1,"ss03" 1;
    background:var(--bg);color:var(--tx);line-height:1.62;overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none}
  img{max-width:100%;display:block}
  h1,h2,h3{font-weight:600;letter-spacing:-.03em;line-height:1.1}

  /* Cada bloque es <section class="wrap">: las dos reglas caen en el MISMO
     elemento y .wrap gana por especificidad. Si .wrap escribiera el shorthand
     "padding", el aire vertical de section quedaría en cero y la página se
     vería apelmazada. Por eso cada una toca sólo su eje. */
  .wrap{max-width:1080px;margin:0 auto;padding-left:24px;padding-right:24px;position:relative;z-index:2}
  section{padding-top:96px;padding-bottom:96px;position:relative}
  @media(max-width:700px){section{padding-top:68px;padding-bottom:68px}}

  /* ── Las fotos de fondo, como en la Home ───────────────────────────────
     Nada de recuadros: el contenido flota sobre la foto y el velo se encarga
     de que el texto se lea. */
  .con-foto{overflow:hidden}
  .fondo{
    position:absolute;inset:0;z-index:0;
    background-size:cover;background-position:center;
    transform:scale(1.04);
  }
  .fondo.lateral{background-position:right center}
  /* Dos capas que se superponen: la vertical funde la foto con la sección de
     arriba y la de abajo; la diagonal protege la izquierda, que es donde vive
     el texto, y deja la foto a la vista hacia la derecha.
     🔴 Medido: con .97 y .95 la foto desaparecía y sólo asomaba su parte más
     clara, como un parche. Estos valores dejan ver la foto y el texto igual
     pasa 12:1 de contraste. */
  .velo{
    position:absolute;inset:0;z-index:1;
    background:
      linear-gradient(180deg,rgba(8,9,10,.94) 0%,rgba(8,9,10,.58) 42%,rgba(8,9,10,.9) 100%),
      linear-gradient(100deg,rgba(8,9,10,.93) 0%,rgba(8,9,10,.62) 50%,rgba(8,9,10,.22) 100%);
  }
  /* Cuando la foto tiene que respirar más a la derecha */
  .velo-lateral{
    background:
      linear-gradient(100deg,rgba(8,9,10,.97) 0%,rgba(8,9,10,.9) 40%,rgba(8,9,10,.3) 80%,rgba(8,9,10,.55) 100%),
      linear-gradient(180deg,rgba(8,9,10,.9) 0%,transparent 22%,transparent 72%,rgba(8,9,10,.95) 100%);
  }

  /* ── Hero ──────────────────────────────────────────────────────────────── */
  .hero{
    position:relative;min-height:92svh;display:flex;align-items:flex-end;
    padding:120px 0 74px;overflow:hidden;
  }
  .hero .fondo{animation:acercar 16s ease-out both}
  @keyframes acercar{from{transform:scale(1.04)}to{transform:scale(1.13)}}
  .hero-txt{width:100%}

  /* El lockup de las dos marcas. El logo de Norte va acá cuando lo tengamos:
     hoy es tipográfico para no poner un archivo de baja resolución. */
  .lockup{
    display:inline-flex;align-items:center;gap:14px;margin-bottom:30px;
    background:var(--vidrio);border:1px solid var(--lin);border-radius:999px;
    padding:11px 22px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    animation:subir .9s .1s cubic-bezier(.16,.9,.3,1) both;
  }
  .m-bolt{font-weight:700;letter-spacing:.3em;color:var(--y);font-size:.92rem}
  .cruz{color:var(--tx3);font-size:.9rem}
  .m-norte{font-weight:600;letter-spacing:.22em;color:var(--tx);font-size:.86rem}

  .hero h1{
    font-size:clamp(2.5rem,7vw,4.9rem);max-width:15ch;margin-bottom:26px;
    animation:subir .9s .22s cubic-bezier(.16,.9,.3,1) both;
  }
  .hero h1 em{font-style:normal;color:var(--y)}
  .hero .bajada{
    font-size:clamp(1.02rem,1.6vw,1.2rem);color:var(--tx2);max-width:56ch;
    animation:subir .9s .4s cubic-bezier(.16,.9,.3,1) both;
  }
  .hero .bajada strong{color:var(--tx)}
  .para{
    color:var(--tx3);font-size:.88rem;margin-top:26px;
    animation:subir .9s .55s cubic-bezier(.16,.9,.3,1) both;
  }
  @keyframes subir{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}

  /* ── Tipografía de las secciones ───────────────────────────────────────── */
  .sec{
    font-size:.72rem;letter-spacing:.24em;text-transform:uppercase;
    color:var(--tx3);font-weight:600;margin-bottom:16px;
  }
  h2{font-size:clamp(1.7rem,4.2vw,2.7rem);margin-bottom:26px;max-width:20ch}
  h3{font-size:1.05rem;margin-bottom:12px}
  p{margin-bottom:18px}
  p:last-child{margin-bottom:0}
  .limitado{max-width:58ch}
  .grande{font-size:1.06rem;color:var(--tx2)}
  .grande strong{color:var(--tx);font-weight:600}
  .destacado{
    font-size:clamp(1.16rem,2.1vw,1.42rem);color:var(--tx);line-height:1.5;
    letter-spacing:-.015em;margin-bottom:26px;
  }
  .destacado strong{color:var(--y);font-weight:600}

  .cita{
    font-size:clamp(1.5rem,3.4vw,2.2rem);font-weight:600;color:var(--y);
    letter-spacing:-.03em;margin:44px 0 12px;padding-left:22px;
    border-left:2px solid var(--y);line-height:1.24;
  }
  .pie-cita{color:var(--tx3);font-size:.92rem;padding-left:24px}

  /* ── Barras translúcidas: lo único que "contiene" ──────────────────────── */
  .barras{display:grid;gap:10px;margin-top:32px;max-width:820px}
  .barra{
    display:flex;align-items:flex-start;gap:16px;
    background:var(--vidrio);border:1px solid var(--lin);border-radius:18px;
    padding:17px 22px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  }
  .barra p{margin:0;color:var(--tx2);font-size:1rem}
  .barra b,.barra strong{color:var(--tx);font-weight:600}
  .tag{
    flex-shrink:0;color:var(--y);font-size:.7rem;font-weight:700;letter-spacing:.14em;
    padding-top:5px;min-width:88px;
  }
  @media(max-width:560px){
    .barra{flex-direction:column;gap:7px}
    .tag{padding-top:0;min-width:0}
  }

  /* ── Los pasos: números grandes, sin caja ──────────────────────────────── */
  .pasos{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:46px 40px;margin-top:12px}
  .paso{min-width:0}
  .paso .num{
    display:block;font-size:2.6rem;font-weight:700;color:var(--y);
    letter-spacing:-.05em;line-height:1;margin-bottom:16px;opacity:.9;
  }
  .paso h3{margin-bottom:8px}
  .paso p{color:var(--tx2);font-size:.99rem;margin:0}

  /* ── Oficios: cápsulas de vidrio, todas iguales ────────────────────────── */
  .oficios{display:flex;flex-wrap:wrap;gap:11px;max-width:900px}
  .of{
    background:var(--vidrio);border:1px solid var(--lin);border-radius:999px;
    padding:12px 20px;font-size:.97rem;color:var(--tx);line-height:1.3;
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  }

  /* ── La promo, a sangre sobre la foto ──────────────────────────────────── */
  .promo-sec{text-align:left}
  .promo-titulo{
    font-size:clamp(2.4rem,8vw,5rem);font-weight:700;color:var(--y);
    letter-spacing:-.045em;line-height:1.02;margin-bottom:10px;
  }
  .promo-sub{font-size:clamp(1.1rem,2.4vw,1.6rem);color:var(--tx);margin-bottom:22px;max-width:24ch}
  .promo-cupo{
    display:inline-block;background:var(--vidrio);border:1px solid var(--lin2);
    border-radius:999px;padding:11px 24px;font-size:.94rem;color:var(--tx);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);margin-bottom:0;
  }
  .promo-detalle{
    display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);
    gap:44px;margin-top:56px;
  }
  @media(max-width:820px){.promo-detalle{grid-template-columns:minmax(0,1fr);gap:36px}}
  .lista{list-style:none;display:grid;gap:13px}
  .lista li{padding-left:24px;position:relative;color:var(--tx2);font-size:1rem}
  .lista li::before{
    content:'';position:absolute;left:0;top:.66em;width:7px;height:7px;
    border-radius:999px;background:var(--y);
  }
  .lista strong{color:var(--tx);font-weight:600}

  /* Los datos por confirmar cuelgan de la promo, separados por una línea:
     son parte de ella, no un tema aparte. */
  .faltan{margin-top:64px;padding-top:44px;border-top:1px solid var(--lin)}
  .faltan .barras{margin-top:26px}

  /* ── Guiones: barra de vidrio arriba, texto suelto abajo ───────────────── */
  .guion{margin-top:30px;margin-bottom:20px;max-width:780px}
  .guion-top{
    display:flex;align-items:center;gap:14px;
    background:var(--vidrio);border:1px solid var(--lin);border-radius:999px;
    padding:9px 9px 9px 20px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    margin-bottom:24px;
  }
  .dur{
    background:var(--y);color:#08090A;border-radius:999px;padding:5px 15px;
    font-size:.8rem;font-weight:700;
  }
  .pal{color:var(--tx3);font-size:.85rem;margin-right:auto}
  .copiar{
    background:rgba(255,255,255,.07);border:1px solid var(--lin2);border-radius:999px;
    color:var(--tx);padding:9px 20px;font-family:inherit;font-size:.86rem;cursor:pointer;
    transition:background .2s;
  }
  .copiar:hover{background:rgba(255,255,255,.14)}
  .guion .texto{padding-left:22px;border-left:1px solid var(--lin)}
  .guion .texto p{font-size:1.16rem;line-height:1.78;color:var(--tx);margin-bottom:19px}
  .guion .texto strong{color:var(--y);font-weight:600}
  .chico-guion{margin-top:0;margin-bottom:0}
  .chico-guion .texto p{font-size:1.03rem;line-height:1.7}
  .menciones{display:grid;gap:34px;margin-top:32px}

  /* ── Spot ──────────────────────────────────────────────────────────────── */
  .spot{margin-top:30px;max-width:820px;padding-left:22px;border-left:1px solid var(--lin)}
  .linea{display:grid;grid-template-columns:96px minmax(0,1fr);gap:18px;padding:15px 0}
  .marca{font-size:.72rem;letter-spacing:.16em;color:var(--y);font-weight:700;padding-top:5px}
  .linea p{color:var(--tx);font-size:1.02rem;margin:0}
  .linea em{color:var(--tx3);font-style:normal}
  @media(max-width:560px){.linea{grid-template-columns:minmax(0,1fr);gap:5px}}

  /* ── Capturas: sin marco, sólo la imagen y su pie ──────────────────────── */
  .capturas{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:26px}
  .capturas figure{min-width:0}
  .capturas img{
    width:100%;border-radius:20px;cursor:zoom-in;
    border:1px solid var(--lin);transition:transform .5s cubic-bezier(.16,.9,.3,1);
  }
  .capturas img:hover{transform:translateY(-6px)}
  .capturas figcaption{padding-top:14px;font-size:.9rem;color:var(--tx3)}

  /* ── Links ─────────────────────────────────────────────────────────────── */
  .links{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
  .link{
    background:var(--vidrio);border:1px solid var(--lin);border-radius:18px;padding:19px 22px;
    display:block;transition:border-color .25s,background .25s;min-width:0;
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  }
  .link:hover{border-color:var(--lin2);background:var(--vidrio2)}
  .link span{display:block;color:var(--y);font-weight:600;font-size:1rem;word-break:break-all}
  .link small{color:var(--tx3);font-size:.87rem}

  /* ── Cierre ────────────────────────────────────────────────────────────── */
  .cierre{min-height:66svh;display:flex;align-items:center}
  .contacto-btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
  .btn-y{background:var(--y);color:#08090A;border-radius:999px;padding:16px 30px;font-weight:600}
  .btn-b{
    background:var(--vidrio);border:1px solid var(--lin2);color:var(--tx);
    border-radius:999px;padding:16px 30px;font-weight:600;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  }
  .firma{color:var(--tx3);font-size:.88rem;margin-top:26px}

  footer{padding:44px 24px 64px;text-align:center}
  footer p{color:#3a4046;font-size:.84rem;max-width:620px;margin:0 auto}

  /* ── La puerta ─────────────────────────────────────────────────────────── */
  #puerta{
    position:fixed;inset:0;z-index:100;
    display:flex;align-items:center;justify-content:center;padding:24px;overflow:hidden;
  }
  #puerta .fondo-puerta{
    position:absolute;inset:0;z-index:0;background:url("../fotos/banner/b4.jpg") center/cover;
    transform:scale(1.06);
  }
  #puerta .velo-puerta{
    position:absolute;inset:0;z-index:1;
    background:radial-gradient(ellipse at center,rgba(8,9,10,.86) 0%,rgba(8,9,10,.97) 62%);
  }
  #puerta .caja-puerta{position:relative;z-index:2;width:100%;max-width:400px;text-align:center}
  #puerta .marca{font-size:1rem;font-weight:700;letter-spacing:.34em;color:var(--y);margin-bottom:28px}
  #puerta h1{font-size:1.6rem;margin-bottom:12px}
  #puerta p{color:var(--tx2);font-size:.95rem;margin-bottom:28px}
  #puerta form{display:flex;flex-direction:column;gap:10px}
  #puerta input{
    width:100%;background:var(--vidrio);border:1px solid var(--lin2);border-radius:999px;
    padding:17px 22px;color:var(--tx);font-family:inherit;font-size:1.05rem;
    text-align:center;letter-spacing:.16em;text-transform:uppercase;outline:none;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  }
  #puerta input:focus{border-color:rgba(255,214,0,.55)}
  #puerta button{
    background:var(--y);color:#08090A;border:0;border-radius:999px;padding:17px;
    font-family:inherit;font-size:1rem;font-weight:600;cursor:pointer;
  }
  #puerta button:disabled{opacity:.5;cursor:default}
  #puerta .mal{color:var(--rojo);font-size:.9rem;min-height:22px;margin:14px 0 0}
  #puerta .pie{color:var(--tx3);font-size:.82rem;margin:28px 0 0}

  /* Visor de capturas */
  #visor{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.95);display:none;align-items:center;justify-content:center;padding:26px;cursor:zoom-out}
  #visor.on{display:flex}
  #visor img{max-width:100%;max-height:92vh;object-fit:contain;border-radius:16px}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body style="overflow:hidden">

<!-- La puerta. El contenido de esta página está cifrado con AES-GCM: sin el
     código no se descifra, y mirar el código fuente no muestra nada. -->
<div id="puerta">
  <div class="fondo-puerta"></div>
  <div class="velo-puerta"></div>
  <div class="caja-puerta">
    <p class="marca">BOLT</p>
    <h1>Material de aire</h1>
    <p>Esta página es privada. Poné el código que te pasamos.</p>
    <form id="formPuerta" autocomplete="off">
      <input id="codigo" type="text" placeholder="Código" autocapitalize="characters"
             autocomplete="off" spellcheck="false" aria-label="Código de acceso" required>
      <button id="btnEntrar" type="submit">Entrar</button>
    </form>
    <p class="mal" id="mal" role="alert"></p>
    <p class="pie">¿No tenés el código? Escribinos: soporte@bolt.com.ar</p>
  </div>
</div>

<main id="contenido"></main>

<div id="visor"><img src="" alt=""></div>

  function contarPalabras(){

  function engancharCopiar(){

          setTimeout(function(){ b.textContent = antes; }, 1600);

  function engancharVisor(){
    var v = document.getElementById('visor'), img = v.querySelector('img');
    document.querySelectorAll('.capturas img').forEach(function(i){
      i.addEventListener('click', function(){ img.src = i.src; v.classList.add('on'); });
    });
    v.addEventListener('click', function(){ v.classList.remove('on'); });
    document.addEventListener('keydown', function(e){ if(e.key==='Escape') v.classList.remove('on'); });
  }

  function pintar(html){
    document.getElementById('contenido').innerHTML = html;
    document.getElementById('puerta').remove();
    document.body.style.overflow = '';
    contarPalabras(); engancharCopiar(); engancharVisor();
  }

  var form = document.getElementById('formPuerta');
  var input = document.getElementById('codigo');
  var mal = document.getElementById('mal');
  var btn = document.getElementById('btnEntrar');

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    mal.textContent = ''; btn.disabled = true; btn.textContent = 'Abriendo…';
    try {
      var html = await abrir(input.value.trim().toUpperCase());
      try { sessionStorage.setItem(LLAVE_SESION, input.value.trim().toUpperCase()); } catch(_){}
      pintar(html);
    } catch(_) {
      mal.textContent = 'Ese código no es.';
      btn.disabled = false; btn.textContent = 'Entrar';
      input.select();
    }
  });

  // Si ya entró en esta pestaña, no lo vuelve a pedir.
  try {
    var guardado = sessionStorage.getItem(LLAVE_SESION);
    if (guardado) abrir(guardado).then(pintar).catch(function(){});
  } catch(_){}
})();
</script>
</body>
</html>
